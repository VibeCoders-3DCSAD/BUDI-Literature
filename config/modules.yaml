# Literature relevance module definitions.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for what "relevant" means.
# When the thesis topical outline, architecture, or algorithm selection
# changes, edit this file and re-run:
#   python3 scripts/score.py        # fast: uses cached embeddings
# No code changes needed.
#
# Each module has a `description` (used for semantic BERT matching) and a
# list of `keywords` (used for lexical TF-IDF/BM25 matching). Keep the
# description in plain prose — it is embedded as the module query.
#
# Last realigned 2026-09-26 against Topical Outline V4 (`GROUP4 - TOPICAL
# OUTLINE - V4 - 09.26.26.docx`). Three substantive changes:
#
#   - financial_profile_classification is no longer an SVM module. V4 replaced
#     the SVM classifier with a rule-based saver/borrower classifier.
#   - system_evaluation no longer cites TAM. V4 dropped TAM/UTAUT and specifies
#     SUS and ISO/IEC 25010:2023 instead.
#   - Four modules were added for leaves V4 requires that nothing covered:
#     financial_planning (now the central concept of the thesis, not a
#     subtopic), seasonal_expense_forecasting, performance_indicators, and
#     agile_methodology.

weights:
  bert: 0.5
  tfidf: 0.3
  bm25: 0.2

# Provisional tier thresholds (max combined relevance across modules).
# Re-calibrate against scores/validation.md, not by instinct.
tiers:
  crucial_min: 0.45
  supporting_min: 0.30

# Semantic similarity threshold for redundancy clustering (0-1).
# 0.98 = hard duplicates only (identical/near-identical text). Lower to
# 0.92-0.95 to surface topically-similar review groups.
redundancy_threshold: 0.98

modules:
  - id: financial_profile_classification
    name: Saver and Borrower Profile Classification
    description: >-
      Classifying users into saver, borrower, both, or neither profiles from
      financial-condition dimensions: emergency fund coverage,
      debt-service-to-income ratio, financial margin, and credit card
      behavior. Rule-based and threshold-based classification, transparent
      and explainable decision rules, and the use of segmentation to
      differentiate financial interventions for Filipino working adults.
    keywords:
      - saver profile
      - borrower profile
      - profile classification
      - rule-based classification
      - threshold rule
      - financial condition
      - emergency fund coverage
      - debt-service-to-income
      - financial margin
      - credit card behavior
      - income classification
      - explainable rule

  - id: financial_planning
    name: Financial Planning Process
    description: >-
      The financial planning process as a discipline: assessing financial
      situation, setting financial goals, developing a plan, executing and
      adhering to it, and reviewing and monitoring progress. Financial
      planning behavior and its determinants, financial goals and
      constraints, and the problems and difficulties households face in
      planning, saving, and managing debt.
    keywords:
      - financial planning
      - financial plan
      - financial situation
      - financial goals
      - planning behavior
      - plan adherence
      - review and monitoring
      - financial constraint
      - household financial decisions
      - financial well-being

  - id: financial_literacy
    name: Financial Literacy and Capability
    description: >-
      Measuring financial literacy, financial education, financial
      knowledge, and financial capability. Understanding how financial
      literacy and numeracy influence saving, budgeting, and spending
      behavior of Filipino young adults.
    keywords:
      - financial literacy
      - financial education
      - financial knowledge
      - financial capability
      - numeracy
      - money management

  - id: expense_categorization
    name: Expense Categorization
    description: >-
      Categorizing user transactions into meaningful spending categories,
      mapping expenses to classification standards such as PCOICOP, and
      automatically tagging or classifying transactions from transaction
      data.
    keywords:
      - expense categorization
      - transaction classification
      - expenditure categories
      - PCOICOP
      - spending categories
      - categorization

  - id: forecasting
    name: Seasonal Expense Forecasting
    description: >-
      Forecasting future expenses from historical time series, with
      emphasis on seasonal and cyclical spending patterns. SARIMA and ARIMA
      modelling of household consumption, stationarity and differencing,
      seasonal parameter selection from ACF and PACF, forecast intervals and
      uncertainty, and evaluation with MAE, RMSE, SMAPE, and directional
      accuracy. Machine-learned alternatives such as LSTM and gradient
      boosting appear as contrasts, not as the study's method.
    keywords:
      - SARIMA
      - seasonal ARIMA
      - time series forecasting
      - seasonal pattern
      - seasonal spending
      - household consumption
      - autocorrelation
      - ACF
      - PACF
      - forecast interval
      - stationarity
      - differencing
      - MAE
      - RMSE
      - SMAPE
      - directional accuracy
      - spend prediction
      - ARIMA
      - LSTM

  - id: seasonal_expense_forecasting
    name: Seasonal Consumption Patterns
    description: >-
      Why household spending is seasonal: holiday and Christmas spending,
      school enrolment and tuition cycles, agricultural and payday cycles,
      and weather-driven variation. Aggregate and population-level
      seasonality that can be used to inform or benchmark individual-level
      forecasts, and the data-resolution limits that follow from it.
    keywords:
      - seasonal consumption
      - seasonality
      - holiday spending
      - Christmas spending
      - school enrollment
      - school calendar
      - consumption seasonality
      - quarterly seasonality
      - aggregate seasonality
      - population-level forecast
      - temporal disaggregation

  - id: anomaly_detection
    name: Anomaly and Overspending Detection
    description: >-
      Detecting unusual transactions, overspending episodes, and financial
      stress indicators. Outlier detection in spending using methods such as
      isolation forests, clustering, and autoencoders.
    keywords:
      - anomaly detection
      - outlier
      - IQR
      - isolation forest
      - unusual transaction
      - overspending
      - fraud detection
      - financial stress

  - id: budget_recommendation
    name: Budget Recommendation and Planning
    description: >-
      Recommending budget allocations, protected spending categories,
      spending limits, and allocation strategies. Budgeting methods such as
      envelope budgeting, zero-based budgeting, payday budgeting, and budget
      tracking.
    keywords:
      - budget recommendation
      - budgeting
      - budget allocation
      - spending limit
      - envelope budgeting
      - zero-based budgeting
      - linear programming
      - budget planning
      - allocation strategy

  - id: savings
    name: Savings and Goal Setting
    description: >-
      Saving behavior, savings goals, emergency funds, saving intentions and
      saving rates. Goal setting and savings goal management in personal
      finance applications.
    keywords:
      - savings
      - saving behavior
      - emergency fund
      - goal setting
      - saving intention
      - saving rate

  - id: debt_management
    name: Debt Management
    description: >-
      Debt accumulation, repayment strategies, borrowing behavior, digital
      lending, credit, loans, and payday lending. Managing debt in personal
      finance.
    keywords:
      - debt
      - loan
      - borrowing
      - credit
      - repayment
      - digital lending
      - debt management
      - payday

  - id: behavioral_insights
    name: Behavioral Finance Insights
    description: >-
      Behavioral finance and psychology of money: mental accounting, payday
      salience, spending triggers, self-control, financial habits, and
      behavioral biases in personal financial decisions.
    keywords:
      - mental accounting
      - payday effect
      - behavioral finance
      - spending behavior
      - impulse buying
      - self-control
      - financial habits
      - behavioral bias

  - id: pfms_systems
    name: Personal Finance Management Systems
    description: >-
      Existing personal finance management applications, mobile banking apps,
      fintech, digital wallets, and intelligent PFM systems. Features,
      dashboards, transaction entry, and architecture of finance tracking
      applications.
    keywords:
      - personal finance app
      - PFM
      - mobile application
      - financial management system
      - fintech
      - digital wallet
      - banking app
      - finance tracker

  - id: ml_algorithms
    name: Machine Learning Algorithms for Personal Finance
    description: >-
      Machine learning algorithms applied to personal finance: classification,
      regression, optimization, and anomaly detection algorithms, training
      methods, and model evaluation. Random forest, naive Bayes, LSTM, neural
      networks, and gradient boosting for spending, income, and financial
      behavior data.
    keywords:
      - machine learning
      - random forest
      - naive bayes
      - neural network
      - gradient boosting
      - classification
      - regression
      - model evaluation
      - accuracy
      - F1

  - id: filipino_context
    name: Filipino Financial Ecosystem and Culture
    description: >-
      The Philippine financial ecosystem and cultural context: financial
      behavior of Filipinos, Filipino working young adults, OFW remittances,
      local economic conditions, FIES and BSP survey data, and culturally
      specific financial practices.
    keywords:
      - Filipino
      - Philippines
      - NCR
      - BSP
      - FIES
      - PSA
      - OFW
      - remittance
      - household
      - young adults

  - id: privacy_security
    name: Privacy and Security in Finance Apps
    description: >-
      Financial data privacy, mobile application security, permission
      concerns, data protection, and trust in financial applications.
    keywords:
      - privacy
      - security
      - data protection
      - permission
      - trust
      - encryption

  - id: user_engagement
    name: User Engagement and Retention
    description: >-
      User engagement, retention, gamification, nudges, notifications, habit
      formation, and adoption of personal finance applications.
    keywords:
      - engagement
      - retention
      - gamification
      - nudge
      - notification
      - user experience
      - habit
      - adoption

  - id: mobile_design
    name: Mobile Application Design
    description: >-
      Mobile user interface and user experience design for finance
      applications, mobile development platforms such as Android, iOS,
      Flutter, and cross-platform development.
    keywords:
      - mobile app
      - Android
      - iOS
      - Flutter
      - user interface
      - user experience
      - mobile development

  - id: system_evaluation
    name: Software Quality and Usability Evaluation
    description: >-
      Evaluating software quality and perceived usability against
      recognised instruments. The System Usability Scale and its
      interpretation, the ISO/IEC 25010 software product quality model and
      its characteristics (functional suitability, performance efficiency,
      reliability, security, portability, usability), and quantitative
      quality targets expressed as response-time, error-rate, availability,
      and recoverability thresholds.
    keywords:
      - ISO/IEC 25010
      - ISO 25010
      - software quality model
      - software product quality
      - functional suitability
      - performance efficiency
      - reliability
      - portability
      - maintainability
      - System Usability Scale
      - SUS
      - usability evaluation
      - software quality evaluation
      - system evaluation
      - user acceptance
      - quality threshold

  - id: performance_indicators
    name: Financial Outcome Performance Indicators
    description: >-
      Measuring whether a personal finance system actually improves the
      user's finances: savings rate, savings goal progress, alert frequency
      for unusual expenses, debt repayment progress, and plan adherence.
      Operational and business KPIs for financial planning interventions,
      distinct from algorithmic accuracy metrics.
    keywords:
      - savings rate
      - savings progress
      - savings goal progress
      - alert frequency
      - debt progress
      - debt repayment progress
      - plan adherence
      - performance indicator
      - KPI
      - financial outcome
      - budget utilization rate
      - constraint satisfaction rate

  - id: agile_methodology
    name: Agile Development Methodology
    description: >-
      Agile software development for data-and-model-bearing systems: the
      Agile lifecycle, iterative and incremental delivery, and specifically
      Kanban with workflow visualisation, work-in-progress limits, and flow
