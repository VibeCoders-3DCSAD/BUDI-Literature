      cross-platform mobile system development practice.
    keywords:
      - Agile
      - Agile methodology
      - Agile development lifecycle
      - Kanban
      - Scrum
      - work-in-progress
      - iterative development
      - incremental delivery
      - software development methodology
      - data collection
      - model development
      - system development

  - id: synthetic_data_mlops
    name: Synthetic Data and ML Serving
    description: >-
      Synthetic data generation for training machine learning models, and
      serving or deploying machine learning models in production
      applications.
    keywords:
      - synthetic data
      - data generation
      - model deployment
      - model serving
      - production

  - id: financial_wellbeing
    name: Financial Well-being and Security
    description: >-
      Financial well-being, financial wellness, financial stress, financial
      resilience, and financial health of individuals and households.
    keywords:
      - financial well-being
      - financial wellness
      - financial stress
      - financial resilience
      - financial health
      - financial security
